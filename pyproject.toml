[project]
name = "orgfold"
version = "0.1.0"
description = "AI-powered file organizer using Ollama"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "langchain-text-splitters",
    "pypdf",
    "unstructured",
    "markdown"
]

[project.scripts]
orgfold = "orgfold.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"